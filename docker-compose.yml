# Local stack for developers with Docker: Postgres + MinIO (S3 API) + the app
# image built from the Dockerfile, wired like AWS.
#
#   docker compose up --build        then open http://localhost:8080
#   docker compose down -v           stop and delete local data
#
# Gemini keys (optional) are read from your shell or a .env file next to this
# file. With no keys, set EXTRACTOR=mock (the default here).

name: apna-rashan

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arad
      POSTGRES_PASSWORD: arad
      POSTGRES_DB: arad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arad -d arad"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Pin a release you have tested if you need reproducible local runs.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/arad-invoices &&
      mc version enable local/arad-invoices &&
      mc anonymous set none local/arad-invoices"
    restart: "no"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: info
      WEB_DIST: /app/web
      RUN_WORKER: "true"
      DATABASE_URL: postgres://arad:arad@postgres:5432/arad
      STORAGE_DRIVER: s3
      S3_BUCKET: arad-invoices
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Dev-only values. Never reuse them anywhere real.
      SESSION_SECRET: local-dev-session-secret-not-for-production-use
      DATA_ENCRYPTION_KEY: bG9jYWwtZGV2LW9ubHktMzItYnl0ZS1rZXktISEhISE=
      SEED_OWNER_NAME: Owner
      SEED_OWNER_PHONE: "9000000001"
      SEED_OWNER_PIN: ${SEED_OWNER_PIN:-1234}
      EXTRACTOR: ${EXTRACTOR:-mock}
      DATA_CLASS: synthetic
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_MODEL: gemini-flash-latest
      GEMINI_SECOND_MODEL: gemini-pro-latest
      GEMINI_TIER: free
      TEXTRACT_ENABLED: "false"
      AI_ALLOW_TRAINING_PROVIDERS_FOR_REAL_DATA: "false"
      HDFC_CLIENT_CODE: ARAD01
      RTGS_FROM_PAISE: "20000000"
      COOLING_OFF_HOURS: "24"
      REQUIRE_DIFFERENT_APPROVER: "true"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
